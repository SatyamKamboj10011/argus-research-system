[project]
name = "argus-research"
version = "2.0.0"
description = "Multi-agent research intelligence system: search, read, write, critique."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF001",  # typographic punctuation in prose strings is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # fixtures must set env vars before importing argus
"agents.py" = ["F401"]  # compatibility shim re-exports
"tools.py" = ["F401"]
"pipeline.py" = ["F401"]
"api.py" = ["F401"]
